    <!-- PWA 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 단어 가리기 효과 */
        .word-eng, .word-kor { transition: all 0.3s ease; user-select: none; }
        .blur-active { filter: blur(10px); opacity: 0.2; }
        .revealed { filter: blur(0px) !important; opacity: 1 !important; }
        
        /* 가로 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 탭 강조 스타일 */
        .tab-active { color: #4f46e5; position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: 0; left: 20%; width: 60%; height: 3px; background: #4f46e5; border-radius: 10px; }
    </style>
</head>

                <!-- JS에서 생성 -->
            </div>
        </div>
    </header>

        };

        // 전역 상태
        let currentCategory = 'basic';
        let currentPart = 1;
        let isEngBlurred = false;
        let isKorBlurred = false;

        // 데이터 파싱
        function getWords(cat) {
            const words = [];
            rawData[cat].split('/').forEach(s => {
                const [id, eng, kor] = s.split('|');
                if(id) words.push({id, eng, kor});
            });
            return words;
        }

        // 화면 렌더링
        function render() {
            const allWords = getWords(currentCategory);
            const container = document.getElementById('wordContainer');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const noResult = document.getElementById('noResult');
            
            let displayList = [];
            if (search) {
                displayList = allWords.filter(w => w.eng.toLowerCase().includes(search) || w.kor.includes(search));
                document.getElementById('partNav').classList.add('opacity-20', 'pointer-events-none');
            } else {
                const start = (currentPart - 1) * 100;
                displayList = allWords.slice(start, start + 100);
                document.getElementById('partNav').classList.remove('opacity-20', 'pointer-events-none');
            }

            if (displayList.length === 0) {
                container.innerHTML = '';
                noResult.classList.remove('hidden');
                return;
            }
            noResult.classList.add('hidden');

            container.innerHTML = displayList.map(w => `
                <div class="flex items-center p-3 border-b border-slate-50 hover:bg-indigo-50/20 rounded-2xl transition-colors group">
                    <span class="w-8 text-[10px] text-slate-200 font-black text-center">${w.id}</span>
                    <button onclick="playTTS('${w.eng.replace(/'/g, "\\'")}')" class="p-2.5 text-indigo-400 mr-2 active:scale-75 transition-transform focus:outline-none">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06z"/></svg>
                    </button>
                    <div class="flex-1 min-w-0" onclick="reveal(this)">
                        <h3 class="word-eng text-lg font-extrabold text-slate-800 break-words ${isEngBlurred ? 'blur-active' : ''}">${w.eng}</h3>
                        <p class="word-kor text-xs font-bold text-slate-400 break-words ${isKorBlurred ? 'blur-active' : ''}">${w.kor}</p>
                    </div>
                </div>
            `).join('');
        }

        // 파트 네비게이션 생성
        function renderPartNav() {
            const count = Math.ceil(getWords(currentCategory).length / 100);
            const nav = document.getElementById('partNav');
            nav.innerHTML = '';
            for(let i=1; i<=count; i++) {
                const btn = document.createElement('button');
                btn.innerText = `P ${i}`;
                btn.className = `shrink-0 px-4 py-2 rounded-full text-xs font-black transition-all ${currentPart === i ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-400 border border-slate-100'}`;
                btn.onclick = () => { currentPart = i; render(); renderPartNav(); window.scrollTo(0,0); };
                nav.appendChild(btn);
            }
        }

        // 카테고리 전환
        function setCategory(cat) {
            currentCategory = cat;
            currentPart = 1;
            document.getElementById('searchInput').value = '';
            document.getElementById('tabBasic').className = `flex-1 py-3 text-sm font-black transition-all ${cat==='basic' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('tabToeic').className = `flex-1 py-3 text-sm font-black transition-all ${cat==='toeic' ? 'tab-active' : 'text-gray-400'}`;
            renderPartNav();
            render();
        }

        // 개별 확인
        function reveal(el) {
            el.querySelectorAll('h3, p').forEach(s => s.classList.add('revealed'));
        }

        // 전체 가리기 토글
        function toggleBlur(type) {
            if(type === 'eng') {
                isEngBlurred = !isEngBlurred;
                document.getElementById('btnEngBlur').classList.toggle('bg-indigo-600', isEngBlurred);
                document.getElementById('btnEngBlur').classList.toggle('text-white', isEngBlurred);
            } else {
                isKorBlurred = !isKorBlurred;
                document.getElementById('btnKorBlur').classList.toggle('bg-indigo-600', isKorBlurred);
                document.getElementById('btnKorBlur').classList.toggle('text-white', isKorBlurred);
            }
            render();
        }

        // 내장 TTS 엔진 (갤럭시 최적화)
        function playTTS(txt) {
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(txt.split(',')[0].replace(/[~-]/g, '').trim());
            u.lang = 'en-US';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        document.getElementById('searchInput').addEventListener('input', render);

        window.onload = () => {
            setCategory('basic');
            // 브라우저 음성 엔진 깨우기
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        };
    </script>
